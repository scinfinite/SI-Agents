<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>SI-Agents Control Center</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Control Center navigation">
      <div class="brand"><span class="mark">SI</span><div><strong>SI-Agents</strong><small>Control Center</small></div></div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot"><span class="dot" id="connection-dot"></span><span id="connection-text">Connecting</span></div>
    </aside>
    <main class="content">
      <header class="topbar">
        <div><p class="eyebrow">OPERATOR CONSOLE</p><h1 id="page-title">Overview</h1><p id="page-subtitle" class="muted">Live state from the Control API.</p></div>
        <div class="top-actions"><button id="refresh" class="button" type="button">Refresh</button><span id="updated" class="muted">—</span></div>
      </header>
      <div id="error" class="error" role="alert" hidden></div>
      <section id="view" aria-live="polite"></section>
    </main>
  </div>
  <noscript><p class="noscript">JavaScript is required for the Control Center interface. The versioned API remains available directly.</p></noscript>
  <script src="/assets/app.js" defer></script>
</body>
</html>
