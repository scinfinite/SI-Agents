[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "si-agents"
version = "0.1.0"
description = "Evidence-driven AI engineering system"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
si = "core.cli.main:main"

[tool.setuptools.packages.find]
include = ["adapters*", "agents*", "core*", "skills*", "tools*"]

[tool.setuptools.package-data]
agents = ["**/*.md"]
skills = ["**/*.md", "*.json", "*.yaml"]

[tool.setuptools.data-files]
"share/si-agents/config" = ["config/agent-catalog.json", "config/team-catalog.json", "config/persona-source-index.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["adapters", "agents", "core", "skills", "tools"]
