[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "si-agents"
version = "0.1.0"
description = "Evidence-driven AI engineering system"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
si = "core.cli.dispatch:main"
si-api = "core.control_api.cli:main"
si-web = "core.web.cli:main"
si-tui = "core.tui.cli:main"
si-deploy = "core.deployment_center.cli:main"
si-verify = "core.hardening.cli:main"
si-capacity = "core.cli.capacity:main"

[tool.setuptools.packages.find]
include = ["adapters*", "agents*", "core*", "skills*", "tools*", "sdk*"]

[tool.setuptools.package-data]
agents = ["**/*.md"]
skills = ["**/*.md", "*.json", "*.yaml"]
"core.web" = ["assets/*.html", "assets/*.js", "assets/*.css"]

[tool.setuptools.data-files]
"share/si-agents/config" = ["config/agent-catalog.json", "config/agent-catalog-extensions.json", "config/team-catalog.json", "config/persona-source-index.json", "config/rules.v1.json", "config/governance.v1.json", "config/organization-expansion.v1.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-config --strict-markers"

[tool.ruff]
line-length = 100
required-version = "==0.13.1"

[tool.ruff.lint.isort]
known-first-party = ["adapters", "agents", "core", "sdk", "skills", "tools"]

[tool.ruff.format]
line-ending = "lf"
