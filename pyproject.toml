[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "si-agents"
version = "0.1.0"
description = "Evidence-driven AI engineering system"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["agents*", "core*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["agents", "core", "tools"]
