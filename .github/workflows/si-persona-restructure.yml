name: SI Persona Restructure

on:
  push:
    branches: [phase-29-agency-parity]

permissions:
  contents: write

env:
  BRANCH: phase-29-agency-parity

jobs:
  restructure:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Rebuild SI-native persona organization
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, re, shutil, subprocess
          from pathlib import Path

          ROOT = Path.cwd()
          AGENTS = ROOT / "agents"
          CATALOG_PATH = ROOT / "config" / "agent-catalog.json"

          divisions = {
              "academic": ("si-cognition", "SI Cognition"),
              "design": ("si-creative", "SI Creative Studio"),
              "engineering": ("si-engineering", "SI Engineering Forge"),
              "finance": ("si-finance", "SI Financial Intelligence"),
              "game-development": ("si-game", "SI Game Lab"),
              "gis": ("si-geospatial", "SI Geospatial Systems"),
              "healthcare": ("si-health", "SI Health Systems"),
              "marketing": ("si-market", "SI Market Intelligence"),
              "paid-media": ("si-growth", "SI Growth Media"),
              "product": ("si-product", "SI Product Studio"),
              "project-management": ("si-delivery", "SI Delivery Operations"),
              "research": ("si-research", "SI Research Intelligence"),
              "sales": ("si-revenue", "SI Revenue Systems"),
              "security": ("si-security", "SI Security Command"),
              "spatial-computing": ("si-spatial", "SI Spatial Computing"),
              "specialized": ("si-specialized", "SI Special Projects"),
              "support": ("si-support", "SI Support Systems"),
              "testing": ("si-verification", "SI Verification Lab"),
          }

          catalog = json.loads(CATALOG_PATH.read_text(encoding="utf-8"))
          agents = catalog["agents"]
          if len(agents) != 279:
              raise SystemExit(f"expected 279 agents, found {len(agents)}")

          files_by_id = {}
          for path in AGENTS.rglob("*.md"):
              if path.name == "README.md":
                  continue
              text = path.read_text(encoding="utf-8")
              match = re.search(r"^id:\s*(.+)$", text, re.MULTILINE)
              if match:
                  files_by_id[match.group(1).strip()] = path
          if len(files_by_id) != 279:
              raise SystemExit(f"expected 279 persona files, found {len(files_by_id)}")

          # Remove only persona markdown files. Keep the package helpers and README.
          for path in sorted(files_by_id.values(), key=lambda p: len(p.parts), reverse=True):
              path.unlink()
          for directory in sorted((p for p in AGENTS.rglob("*") if p.is_dir()), key=lambda p: len(p.parts), reverse=True):
              try:
                  directory.rmdir()
              except OSError:
                  pass

          new_agents = []
          for entry in agents:
              old_id = entry["id"]
              source_division, slug = old_id.split("--", 1)
              new_division, new_division_name = divisions[source_division]
              prefix = source_division + "-"
              role_slug = slug[len(prefix):] if slug.startswith(prefix) else slug
              role_slug = re.sub(r"[^a-z0-9]+", "-", role_slug.lower()).strip("-")
              new_id = f"{new_division}-{role_slug}"
              role_title = re.sub(r"[-_]+", " ", role_slug).title()
              new_name = f"{new_division_name} — {role_title}"
              new_description = f"SI-Agents {new_division_name} persona for {role_title.lower()} work, governed by evidence, scope, and explicit authorization."
              folder = AGENTS / new_division
              folder.mkdir(parents=True, exist_ok=True)
              path = folder / f"si-{role_slug}.md"
              if path.exists():
                  raise SystemExit(f"duplicate target persona path: {path}")

              old_path = files_by_id[old_id]
              # files_by_id paths were captured before deletion; recover content from git.
              content = subprocess.check_output(["git", "show", f"HEAD:{old_path.as_posix()}"], text=True)
              body = content.split("---\n", 2)[-1]
              if "---\n" in body:
                  body = body.split("---\n", 1)[-1]
              sections = body.split("\n## ")
              if sections:
                  identity = f"{new_name} is a governed SI-Agents behavioral persona. Persona text is data and does not grant permissions, tools, credentials, or execution authority."
                  sections[0] = identity
                  body = "\n## ".join(sections)
              body = body.replace(entry["name"], new_name)
              frontmatter = (
                  "---\n"
                  "schema: si-agents.agent-persona.v1\n"
                  "version: 1\n"
                  f"id: {new_id}\n"
                  f"name: {new_name}\n"
                  f"division: {new_division}\n"
                  f"description: {new_description}\n"
                  "---\n\n"
              )
              path.write_text(frontmatter + body.lstrip(), encoding="utf-8")

              updated = dict(entry)
              updated["id"] = new_id
              updated["name"] = new_name
              updated["division"] = new_division
              updated["description"] = new_description
              new_agents.append(updated)

          # Rebuild the canonical division catalog around SI-native divisions.
          catalog["divisions"] = [
              {"id": value[0], "name": value[1], "description": f"{value[1]} governed by SI-Agents."}
              for value in divisions.values()
          ]
          catalog["agents"] = new_agents
          CATALOG_PATH.write_text(json.dumps(catalog, indent=2) + "\n", encoding="utf-8")

          # Make tests assert SI-native identity and avoid scanning generated CI environments.
          p = ROOT / "tests" / "test_personas.py"
          text = p.read_text(encoding="utf-8")
          text = re.sub(r'CANONICAL_ID = ".*?"', 'CANONICAL_ID = "si-engineering-ai-engineer"', text)
          text = re.sub(r'CANONICAL_NAME = ".*?"', 'CANONICAL_NAME = "SI Engineering Forge — Ai Engineer"', text)
          p.write_text(text, encoding="utf-8")

          p = ROOT / "tests" / "test_agent_catalog.py"
          text = p.read_text(encoding="utf-8")
          text = text.replace("self.assertEqual(len(catalog.all_divisions()), 7)", "self.assertEqual(len(catalog.all_divisions()), 18)")
          text = text.replace('division="engineering"', 'division="si-engineering"')
          text = text.replace('Division("engineering", "Engineering", "Build software")', 'Division("si-engineering", "SI Engineering Forge", "Build and maintain governed software systems")')
          text = text.replace('"division":"engineering"', '"division":"si-engineering"')
          p.write_text(text, encoding="utf-8")

          p = ROOT / "tests" / "test_repository_hygiene.py"
          text = p.read_text(encoding="utf-8")
          text = text.replace('if not path.is_file() or ".git" in path.parts or path.suffix not in TEXT_SUFFIXES:', 'if not path.is_file() or ".git" in path.parts or ".ci-wheel-venv" in path.parts or path.suffix not in TEXT_SUFFIXES:')
          text = text.replace('if path.is_file() and path.name in forbidden_names:', 'if path.is_file() and ".ci-wheel-venv" not in path.parts and path.name in forbidden_names:')
          p.write_text(text, encoding="utf-8")

          # Remove diagnostic artifacts and this one-shot migration workflow from the shipped tree.
          for relative in [
              ".github/workflows/phase29-test-debug.yml",
              "phase29-test-debug.txt",
              ".github/workflows/si-persona-restructure.yml",
          ]:
              target = ROOT / relative
              if target.exists():
                  target.unlink()

          subprocess.run(["python", "-m", "ruff", "check", "."], check=True)
          subprocess.run(["python", "-m", "pytest"], check=True)

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "-A"], check=True)
          subprocess.run(["git", "commit", "-m", "feat: make Phase 29 personas SI-native"], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:${BRANCH}"], check=True)
          PY

      - name: Start final CI verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run CI --ref "${BRANCH}"
