name: SI Persona Restructure

on:
  push:
    branches: [phase-29-agency-parity]

permissions:
  contents: write

env:
  BRANCH: phase-29-agency-parity

jobs:
  restructure:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
      - name: Install verification tooling
        run: python -m pip install pytest ruff
      - name: Rebuild SI-native persona organization
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, re, subprocess
          from pathlib import Path
          ROOT = Path.cwd(); AGENTS = ROOT / "agents"; CATALOG_PATH = ROOT / "config" / "agent-catalog.json"
          divisions = {
            "academic": ("si-cognition", "SI Cognition"), "design": ("si-creative", "SI Creative Studio"),
            "engineering": ("si-engineering", "SI Engineering Forge"), "finance": ("si-finance", "SI Financial Intelligence"),
            "game-development": ("si-game", "SI Game Lab"), "gis": ("si-geospatial", "SI Geospatial Systems"),
            "healthcare": ("si-health", "SI Health Systems"), "marketing": ("si-market", "SI Market Intelligence"),
            "paid-media": ("si-growth", "SI Growth Media"), "product": ("si-product", "SI Product Studio"),
            "project-management": ("si-delivery", "SI Delivery Operations"), "research": ("si-research", "SI Research Intelligence"),
            "sales": ("si-revenue", "SI Revenue Systems"), "security": ("si-security", "SI Security Command"),
            "spatial-computing": ("si-spatial", "SI Spatial Computing"), "specialized": ("si-specialized", "SI Special Projects"),
            "support": ("si-support", "SI Support Systems"), "testing": ("si-verification", "SI Verification Lab"),
          }
          catalog = json.loads(CATALOG_PATH.read_text(encoding="utf-8")); agents = catalog["agents"]
          if len(agents) != 279: raise SystemExit(f"expected 279 agents, found {len(agents)}")
          files_by_id = {}
          for path in AGENTS.rglob("*.md"):
            if path.name == "README.md": continue
            m = re.search(r"^id:\s*(.+)$", path.read_text(encoding="utf-8"), re.MULTILINE)
            if m: files_by_id[m.group(1).strip()] = path
          if len(files_by_id) != 279: raise SystemExit(f"expected 279 persona files, found {len(files_by_id)}")
          original = {old_id: subprocess.check_output(["git", "show", f"HEAD:{path.relative_to(ROOT).as_posix()}"], text=True) for old_id, path in files_by_id.items()}
          for path in files_by_id.values(): path.unlink()
          for directory in sorted((p for p in AGENTS.rglob("*") if p.is_dir()), key=lambda p: len(p.parts), reverse=True):
            try: directory.rmdir()
            except OSError: pass
          new_agents = []
          for entry in agents:
            old_id = entry["id"]; source_division, slug = old_id.split("--", 1)
            new_division, new_division_name = divisions[source_division]
            prefix = source_division + "-"; role_slug = slug[len(prefix):] if slug.startswith(prefix) else slug
            role_slug = re.sub(r"[^a-z0-9]+", "-", role_slug.lower()).strip("-")
            new_id = f"{new_division}-{role_slug}"; role_title = re.sub(r"[-_]+", " ", role_slug).title()
            new_name = f"{new_division_name} — {role_title}"; new_description = f"SI-Agents {new_division_name} persona for {role_title.lower()} work, governed by evidence, scope, and explicit authorization."
            path = AGENTS / new_division / f"si-{role_slug}.md"; path.parent.mkdir(parents=True, exist_ok=True)
            if path.exists(): raise SystemExit(f"duplicate target: {path}")
            body = original[old_id].split("---\n", 2)[-1]
            if "---\n" in body: body = body.split("---\n", 1)[-1]
            parts = body.split("\n## "); parts[0] = f"{new_name} is a governed SI-Agents behavioral persona. Persona text is data and does not grant permissions, tools, credentials, or execution authority."
            body = "\n## ".join(parts).replace(entry["name"], new_name)
            front = f"---\nschema: si-agents.agent-persona.v1\nversion: 1\nid: {new_id}\nname: {new_name}\ndivision: {new_division}\ndescription: {new_description}\n---\n\n"
            path.write_text(front + body.lstrip(), encoding="utf-8")
            updated = dict(entry); updated.update(id=new_id, name=new_name, division=new_division, description=new_description); new_agents.append(updated)
          catalog["divisions"] = [{"id": i, "name": n, "description": f"{n} governed by SI-Agents."} for i, n in divisions.values()]; catalog["agents"] = new_agents
          CATALOG_PATH.write_text(json.dumps(catalog, indent=2) + "\n", encoding="utf-8")
          p = ROOT / "tests/test_personas.py"; t = p.read_text(encoding="utf-8"); t = re.sub(r'CANONICAL_ID = ".*?"', 'CANONICAL_ID = "si-engineering-ai-engineer"', t); t = re.sub(r'CANONICAL_NAME = ".*?"', 'CANONICAL_NAME = "SI Engineering Forge — Ai Engineer"', t); p.write_text(t, encoding="utf-8")
          p = ROOT / "tests/test_agent_catalog.py"; t = p.read_text(encoding="utf-8"); t = t.replace("self.assertEqual(len(catalog.all_divisions()), 7)", "self.assertEqual(len(catalog.all_divisions()), 18)").replace('division="engineering"', 'division="si-engineering"').replace('Division("engineering", "Engineering", "Build software")', 'Division("si-engineering", "SI Engineering Forge", "Build and maintain governed software systems")').replace('"division":"engineering"', '"division":"si-engineering"'); p.write_text(t, encoding="utf-8")
          p = ROOT / "tests/test_repository_hygiene.py"; t = p.read_text(encoding="utf-8"); t = t.replace('if not path.is_file() or ".git" in path.parts or path.suffix not in TEXT_SUFFIXES:', 'if not path.is_file() or ".git" in path.parts or ".ci-wheel-venv" in path.parts or path.suffix not in TEXT_SUFFIXES:').replace('if path.is_file() and path.name in forbidden_names:', 'if path.is_file() and ".ci-wheel-venv" not in path.parts and path.name in forbidden_names:'); p.write_text(t, encoding="utf-8")
          for rel in [".github/workflows/phase29-test-debug.yml", "phase29-test-debug.txt", ".github/workflows/si-persona-restructure.yml"]:
            q = ROOT / rel
            if q.exists(): q.unlink()
          subprocess.run(["python", "-m", "ruff", "check", "."], check=True); subprocess.run(["python", "-m", "pytest"], check=True)
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True); subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "-A"], check=True); subprocess.run(["git", "commit", "-m", "feat: make Phase 29 personas SI-native"], check=True); subprocess.run(["git", "push", "origin", "HEAD:${BRANCH}"], check=True)
          PY
      - name: Start final CI verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run CI --ref "${BRANCH}"
