name: Phase 29 Persona Build

on:
  push:
    branches: [phase-29-agency-parity]

permissions:
  contents: write

jobs:
  build-personas:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build persona corpus from pinned source inventory
        run: python tools/persona_parity_build.py --commit
