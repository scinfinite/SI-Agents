name: SI Cleanup
on:
  push:
    branches: [phase-29-agency-parity]
permissions:
  contents: write
env:
  BRANCH: phase-29-agency-parity
jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-29-agency-parity
          fetch-depth: 0
      - name: Remove generated runtime artifacts
        run: |
          git rm -r --ignore-unmatch -- '**/__pycache__' || true
          rm -f phase29-test-debug.txt
          cat > .gitignore <<'EOF'
# Python runtime artifacts
__pycache__/
*.py[cod]

# Build and test outputs
build/
dist/
*.egg-info/
.pytest_cache/
.ruff_cache/

# Local environments
.venv/
venv/
.ci-wheel-venv/
EOF
          rm -f .github/workflows/si-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove generated runtime artifacts'
          git push origin "HEAD:$BRANCH"
