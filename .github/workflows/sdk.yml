name: SDK

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python SDK compile and tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m compileall -q sdk/python
          python -m pytest -q tests/unit/test_phase64_sdk.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: TypeScript SDK check
        working-directory: sdk/typescript
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
          npm run build
