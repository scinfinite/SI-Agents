name: Phase 29 Test Debug
on:
  push:
    branches: [phase-29-agency-parity]
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . pytest
      - shell: bash
        run: |
          set +e
          python -m pytest -x -vv > phase29-test-debug.txt 2>&1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase29-test-debug.txt
          git commit -m 'chore(phase29): capture actual test diagnostic' || true
          git push || true
