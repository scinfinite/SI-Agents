name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install project and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt

      - name: Build distributions
        run: python -m build

      - name: Verify wheel installation
        run: |
          set +e
          python -m venv .ci-wheel-venv
          .ci-wheel-venv/bin/python -m pip install dist/*.whl > wheel-smoke.txt 2>&1
          failed=$?
          echo "pip install exit=$failed" >> wheel-smoke.txt
          .ci-wheel-venv/bin/python -c "import adapters, agents, core; from adapters.opencode import OpenCodeAdapter; from agents import AgentSpec; from core.runtime import RuntimeEngine; print('wheel import OK')" >> wheel-smoke.txt 2>&1
          code=$?; echo "import exit=$code" >> wheel-smoke.txt; if [ $code -ne 0 ]; then failed=1; fi
          for command in "agents" "personas --division si-engineering" "skills --json" "skills --inspect inspect-repository --json" "skills --compose inspect-repository verify-change --json" "teams"; do
            echo "--- si $command ---" >> wheel-smoke.txt
            .ci-wheel-venv/bin/si $command >> wheel-smoke.txt 2>&1
            code=$?; echo "exit=$code" >> wheel-smoke.txt; if [ $code -ne 0 ]; then failed=1; fi
          done
          cat wheel-smoke.txt
          exit $failed

      - name: Upload wheel diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wheel-diagnostics
          path: wheel-smoke.txt
          if-no-files-found: ignore

      - name: Run SI repository audit
        run: si audit --json

      - name: Run SI integration verification
        run: si verify --json

      - name: Run Ruff
        run: python -m ruff check . --output-format=json > ruff-report.json || (cat ruff-report.json; exit 1)

      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ruff-diagnostics
          path: ruff-report.json
          if-no-files-found: ignore

      - name: Run tests
        run: |
          python -m compileall -q adapters agents core skills tools
          python -m pytest --strict-config --strict-markers > pytest-report.txt 2>&1 || (cat pytest-report.txt; exit 1)

      - name: Verify npm distribution
        run: npm run verify

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-diagnostics
          path: pytest-report.txt
          if-no-files-found: ignore
