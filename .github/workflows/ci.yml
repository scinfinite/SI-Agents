name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . build pytest ruff

      - name: Build distributions
        run: python -m build

      - name: Verify wheel installation
        run: |
          python -m venv .ci-wheel-venv
          .ci-wheel-venv/bin/python -m pip install dist/*.whl
          .ci-wheel-venv/bin/python -c "import adapters, agents, core; from adapters.opencode import OpenCodeAdapter; from agents import AgentSpec; from core.runtime import RuntimeEngine; print('wheel import OK')"
          .ci-wheel-venv/bin/si agents >/dev/null
          .ci-wheel-venv/bin/si personas --division si-engineering >/dev/null
          .ci-wheel-venv/bin/si skills --json >/dev/null
          .ci-wheel-venv/bin/si skills --inspect inspect-repository --json >/dev/null
          .ci-wheel-venv/bin/si skills --compose inspect-repository verify-change --json >/dev/null
          .ci-wheel-venv/bin/si teams >/dev/null

      - name: Run SI repository audit
        run: si audit --json

      - name: Run Ruff
        run: |
          python -m ruff check . --output-format=json > ruff-report.json || (cat ruff-report.json; exit 1)

      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics
          path: ruff-report.json
          if-no-files-found: ignore

      - name: Run tests
        run: python -m pytest
