# Declarative model intelligence. Runtime/provider secrets never belong here.
models:
  routing:
    required_capabilities_are_hard_constraint: true
    prefer_free: true
    max_cost_is_hard_constraint: true
    max_latency_is_hard_constraint: true
  scoring:
    reliability_weight: 100
    latency_penalty_per_ms: 0.01
    cost_penalty_per_currency_unit: 10
  unknown:
    unknown_cost_is_not_assumed_free: true
    unknown_capability_is_not_assumed_supported: true
