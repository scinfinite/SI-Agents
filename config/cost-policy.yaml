cost_policy:
  default_mode: free_first
  paid_resources_require_approval: true
  routing_priority:
    - local_open_source
    - existing_free_quota
    - free_tier
    - lowest_cost_suitable_provider
  prohibit_silent_paid_usage: true
  record_estimated_cost: true
  reject_negative_cost_estimates: true
  budget:
    unspecified_paid_budget: deny
    require_cost_estimate_before_paid_action: true
